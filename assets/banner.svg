<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Orbs Filters -->
    <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80" result="blur" />
    </filter>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Style for dynamic elements & typography -->
  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.55; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatPill3 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    .orb-anim-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .orb-anim-2 {
      animation: pulseOrb 10s ease-in-out infinite alternate;
      transform-origin: 1000px 300px;
    }
    .pill-1 { animation: floatPill1 4s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 5s ease-in-out infinite; }
    .pill-3 { animation: floatPill3 4.5s ease-in-out infinite; }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dashMove 15s linear infinite;
    }
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 46px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 19px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #38bdf8;
      text-transform: uppercase;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Animated Glowing Ambience (Behind everything) -->
  <circle class="orb-anim-1" cx="220" cy="120" r="140" fill="#3b82f6" filter="url(#glow1)" />
  <circle class="orb-anim-2" cx="980" cy="280" r="160" fill="#a855f7" filter="url(#glow1)" />
  <circle cx="600" cy="360" r="100" fill="#06b6d4" opacity="0.15" filter="url(#glow2)" />

  <!-- Subtle Blueprint Tech Grid -->
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Dynamic Animated Architecture Flow Lines (Behind text layer) -->
  <g opacity="0.35">
    <path class="flow-line" d="M 100 80 Q 300 20 600 80 T 1100 80" fill="none" stroke="#60a5fa" stroke-width="1.5" />
    <path class="flow-line" d="M 80 340 Q 400 390 700 340 T 1120 330" fill="none" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="600" cy="80" r="4" fill="#38bdf8" />
    <circle cx="700" cy="340" r="4" fill="#c084fc" />
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(600, 68)">
    <rect x="-140" y="-16" width="280" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <text class="badge-label" text-anchor="middle" y="4">⚡ CURATED ECOSYSTEM GUIDE</text>
  </g>

  <!-- Main Title -->
  <text class="main-title" text-anchor="middle" x="600" y="145">
    Awesome HRMS Ecosystem
  </text>

  <!-- Accent Highlight Line Under Title -->
  <rect x="420" y="165" width="360" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Subtitle -->
  <text class="subtitle" text-anchor="middle" x="600" y="206">
    Open-Source HR Platforms, Payroll Engines &amp; Enterprise SaaS Suites
  </text>

  <!-- Animated Dynamic Interactive Feature Pills (Foreground Layer) -->
  <!-- Pill 1: Employee Lifecycle -->
  <g class="pill-1" transform="translate(180, 260)">
    <rect width="240" height="48" rx="24" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="28" cy="24" r="12" fill="#0369a1" />
    <text x="28" y="28" text-anchor="middle" fill="#38bdf8" font-size="13">👥</text>
    <text class="pill-text" x="52" y="29">Employee Lifecycle &amp; Core HR</text>
  </g>

  <!-- Pill 2: Payroll Automation -->
  <g class="pill-2" transform="translate(470, 260)">
    <rect width="250" height="48" rx="24" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="28" cy="24" r="12" fill="#4338ca" />
    <text x="28" y="28" text-anchor="middle" fill="#818cf8" font-size="13">💳</text>
    <text class="pill-text" x="52" y="29">Payroll &amp; Tax Compliance</text>
  </g>

  <!-- Pill 3: Self-Hosted & Open-Source -->
  <g class="pill-3" transform="translate(770, 260)">
    <rect width="250" height="48" rx="24" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="28" cy="24" r="12" fill="#7e22ce" />
    <text x="28" y="28" text-anchor="middle" fill="#c084fc" font-size="13">🚀</text>
    <text class="pill-text" x="52" y="29">Self-Hosted &amp; Open Source</text>
  </g>

  <!-- Minimal Footer Tagline -->
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" x="600" y="365">
    Maintained by Ishan Dutta • Updated for 2026 • Star ★ to Support
  </text>
</svg>
