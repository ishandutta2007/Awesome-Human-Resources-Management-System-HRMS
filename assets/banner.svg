<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".8"/></linearGradient><filter id="glow1" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="80"/></filter><filter id="glow2" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="60"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.15) translate(20px,-15px);opacity:.55}}@keyframes floatPill1{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatPill2{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes floatPill3{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes dashMove{0%{stroke-dashoffset:200}}.orb-anim-1{animation:pulseOrb 8s ease-in-out infinite alternate;transform-origin:200px 100px}.orb-anim-2{animation:pulseOrb 10s ease-in-out infinite alternate;transform-origin:1000px 300px}.pill-1{animation:floatPill1 4s ease-in-out infinite}.pill-2{animation:floatPill2 5s ease-in-out infinite}.pill-3{animation:floatPill3 4.5s ease-in-out infinite}.flow-line{stroke-dasharray:8 6;animation:dashMove 15s linear infinite}.badge-label,.main-title,.pill-text,.subtitle{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.main-title{font-size:46px;font-weight:800;fill:#fff;letter-spacing:-.5px}.subtitle{font-size:19px;font-weight:400;fill:#94a3b8}.pill-text{font-size:13px;font-weight:600;fill:#e2e8f0}.badge-label{font-size:11px;font-weight:700;letter-spacing:1.5px;fill:#38bdf8;text-transform:uppercase}</style><rect width="1200" height="400" fill="url(#bgGrad)"/><circle cx="220" cy="120" r="140" fill="#3b82f6" class="orb-anim-1" filter="url(#glow1)"/><circle cx="980" cy="280" r="160" fill="#a855f7" class="orb-anim-2" filter="url(#glow1)"/><circle cx="600" cy="360" r="100" fill="#06b6d4" filter="url(#glow2)" opacity=".15"/><rect width="1200" height="400" fill="url(#grid)"/><g opacity=".35"><path fill="none" stroke="#60a5fa" stroke-width="1.5" d="M 100 80 Q 300 20 600 80 T 1100 80" class="flow-line"/><path fill="none" stroke="#c084fc" stroke-width="1.5" d="M 80 340 Q 400 390 700 340 T 1120 330" class="flow-line"/><circle cx="600" cy="80" r="4" fill="#38bdf8"/><circle cx="700" cy="340" r="4" fill="#c084fc"/></g><g transform="translate(600, 68)"><rect width="280" height="30" x="-140" y="-16" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="15"/><text y="4" class="badge-label" text-anchor="middle">⚡ CURATED ECOSYSTEM GUIDE</text></g><text x="600" y="145" class="main-title" text-anchor="middle">Awesome HRMS Ecosystem</text><rect width="360" height="4" x="420" y="165" fill="url(#accentGrad)" rx="2"/><text x="600" y="206" class="subtitle" text-anchor="middle">Open-Source HR Platforms, Payroll Engines &amp; Enterprise SaaS Suites</text><g class="pill-1" transform="translate(180, 260)"><rect width="240" height="48" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.2" rx="24"/><circle cx="28" cy="24" r="12" fill="#0369a1"/><text x="28" y="28" fill="#38bdf8" font-size="13" text-anchor="middle">👥</text><text x="52" y="29" class="pill-text">Employee Lifecycle &amp; Core HR</text></g><g class="pill-2" transform="translate(470, 260)"><rect width="250" height="48" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity=".6" stroke-width="1.2" rx="24"/><circle cx="28" cy="24" r="12" fill="#4338ca"/><text x="28" y="28" fill="#818cf8" font-size="13" text-anchor="middle">💳</text><text x="52" y="29" class="pill-text">Payroll &amp; Tax Compliance</text></g><g class="pill-3" transform="translate(770, 260)"><rect width="250" height="48" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity=".6" stroke-width="1.2" rx="24"/><circle cx="28" cy="24" r="12" fill="#7e22ce"/><text x="28" y="28" fill="#c084fc" font-size="13" text-anchor="middle">🚀</text><text x="52" y="29" class="pill-text">Self-Hosted &amp; Open Source</text></g><text x="600" y="365" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Maintained by Ishan Dutta • Updated for 2026 • Star ★ to Support</text></svg>